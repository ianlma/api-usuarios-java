<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Usuários - Ian Lima</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; background-color: #f0f2f5; color: #333; }
        .container { max-width: 900px; margin: auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #007bff; }
        form { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; flex-wrap: wrap; }
        input { padding: 12px; border: 1px solid #ddd; border-radius: 6px; width: 28%; }
        .search-container { margin-bottom: 25px; display: flex; justify-content: center; }
        .input-busca { width: 100%; border: 2px solid #007bff; }

        button { padding: 12px 20px; cursor: pointer; background-color: #28a745; color: white; border: none; border-radius: 6px; font-weight: bold; transition: 0.3s; }
        button:hover { background-color: #218838; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #f8f9fa; color: #555; }
        .btn-delete { background-color: #dc3545; padding: 8px 12px; font-size: 14px; }
        .btn-delete:hover { background-color: #c82333; }
        .loading { text-align: center; font-style: italic; color: #666; margin: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>Gerenciador de Usuários</h1>

    <form id="userForm">
        <input type="text" id="nome" placeholder="Nome Completo" required>
        <input type="email" id="email" placeholder="E-mail" required>
        <input type="password" id="senha" placeholder="Senha" required>
        <button type="submit" id="btnSalvar">Salvar Usuário</button>
    </form>

    <div class="search-container">
        <input type="text" id="inputBusca" class="input-busca" placeholder="🔍 Buscar usuário por nome...">
    </div>

    <div id="loadingMsg" class="loading" style="display: none;">Processando requisição no Render...</div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody id="userTableBody"></tbody>
    </table>
</div>

<script>
    const API_URL = "https://api-usuarios-java.onrender.com/usuarios";
    const tableBody = document.getElementById('userTableBody');
    const loadingMsg = document.getElementById('loadingMsg');

    let usuariosCache = [];
    let idUsuarioEmEdicao = null;

    async function fetchUsers() {
        try {
            const response = await fetch(API_URL);
            usuariosCache = await response.json();
            renderizarTabela(usuariosCache);
        } catch (error) {
            console.error("Erro ao buscar:", error);
        }
    }

    function renderizarTabela(lista) {
        tableBody.innerHTML = lista.map(user => `
            <tr>
                <td>${user.id}</td>
                <td>${user.nome}</td>
                <td>${user.email}</td>
                <td>
                    <button style="background-color: #007bff; color: white; padding: 8px 12px; font-size: 14px; margin-right: 5px;"
                            onclick="prepararEdicao(${user.id}, '${user.nome}', '${user.email}')">
                        Editar
                    </button>
                    <button class="btn-delete" onclick="deleteUser(${user.id})">Excluir</button>
                </td>
            </tr>
        `).join('');
    }

    function prepararEdicao(id, nome, email) {
        idUsuarioEmEdicao = id;
        document.getElementById('nome').value = nome;
        document.getElementById('email').value = email;
        // Limpamos a senha por segurança na edição, o usuário digita uma nova ou a mesma
        document.getElementById('senha').value = "";

        const btn = document.getElementById('btnSalvar');
        btn.innerText = "Atualizar Usuário";
        btn.style.backgroundColor = "#ffc107";
        btn.style.color = "black";

        document.getElementById('nome').focus();
    }

    document.getElementById('inputBusca').addEventListener('input', (e) => {
        const termo = e.target.value.toLowerCase();
        const filtrados = usuariosCache.filter(u => u.nome.toLowerCase().includes(termo));
        renderizarTabela(filtrados);
    });

    document.getElementById('userForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnSalvar');
        const nome = document.getElementById('nome').value;
        const email = document.getElementById('email').value;
        const senha = document.getElementById('senha').value; // CAPTURA A SENHA

        btn.disabled = true;
        loadingMsg.style.display = 'block';

        const metodo = idUsuarioEmEdicao ? 'PUT' : 'POST';
        const url = idUsuarioEmEdicao ? `${API_URL}/${idUsuarioEmEdicao}` : API_URL;

        try {
            const response = await fetch(url, {
                method: metodo,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, email, senha })
            });

            if (response.ok) {
                document.getElementById('userForm').reset();
                idUsuarioEmEdicao = null;
                btn.innerText = "Salvar Usuário";
                btn.style.backgroundColor = "#28a745";
                btn.style.color = "white";
                fetchUsers();
            } else {
                const erroData = await response.json();
                alert("Erro na API: " + (erroData.message || "Verifique os dados."));
            }
        } catch (error) {
            alert("Erro de conexão com o servidor.");
        } finally {
            btn.disabled = false;
            loadingMsg.style.display = 'none';
        }
    });

    async function deleteUser(id) {
        if (confirm("Excluir este usuário?")) {
            try {
                await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                fetchUsers();
            } catch (error) {
                alert("Erro ao excluir.");
            }
        }
    }

    fetchUsers();
</script>
</body>
</html>
